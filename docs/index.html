<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Ordering System — API Docs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .doc-banner {
      background: #1b1b2f; color: #e8e8f0; font-family: system-ui, sans-serif;
      padding: 14px 20px; font-size: 14px; line-height: 1.5;
      border-bottom: 3px solid #ff7a59;
    }
    .doc-banner strong { color: #ff9f80; }
  </style>
</head>
<body>
  <div class="doc-banner">
    🍽️ <strong>Food Ordering System — API Reference (static)</strong><br>
    Browsable reference for the Order Service REST API. The backend is not hosted, so
    <strong>“Try it out” calls will not reach a live server</strong> — run the service locally
    (<code>localhost:8181</code>) to execute requests.
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout"
    });
  </script>
</body>
</html>
